name: Release MSIX

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    env:
      PROJECT_PATH: UnityExtension\UnityExtension.csproj
      PACKAGE_DIR: UnityExtension\BundleArtifacts
      DOTNET_VERSION: 10.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Dump SDK info
        run: dotnet --info

      - name: Validate release version
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''

          [xml]$project = Get-Content -LiteralPath $env:PROJECT_PATH -Raw
          $versionGroup = @($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1)
          if (-not $versionGroup) {
            throw "Could not find Version properties in $env:PROJECT_PATH."
          }

          $projectVersion = [string]$versionGroup.Version
          $assemblyVersion = [string]$versionGroup.AssemblyVersion
          $fileVersion = [string]$versionGroup.FileVersion

          $manifestPath = Join-Path (Split-Path -Parent $env:PROJECT_PATH) 'Package.appxmanifest'
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $manifestVersion = [string]$manifest.Package.Identity.Version

          if ($projectVersion -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match project Version '$projectVersion'."
          }

          $expectedFourPartVersion = "$tagVersion.0"
          if ($assemblyVersion -ne $expectedFourPartVersion) {
            throw "AssemblyVersion '$assemblyVersion' does not match expected '$expectedFourPartVersion'."
          }

          if ($fileVersion -ne $expectedFourPartVersion) {
            throw "FileVersion '$fileVersion' does not match expected '$expectedFourPartVersion'."
          }

          if ($manifestVersion -ne $expectedFourPartVersion) {
            throw "Package.appxmanifest Identity Version '$manifestVersion' does not match expected '$expectedFourPartVersion'."
          }

      - name: Restore signing certificate from secret
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64)) {
            throw 'MSIX_PFX_BASE64 secret is missing.'
          }

          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_PASSWORD)) {
            throw 'MSIX_PFX_PASSWORD secret is missing.'
          }

          New-Item -ItemType Directory -Force -Path $env:PACKAGE_DIR | Out-Null

          $pfxPath = Join-Path $env:RUNNER_TEMP 'Maoyeedy-MSIX-LocalDev.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:MSIX_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          )

          $cerPath = Join-Path $env:PACKAGE_DIR 'Maoyeedy-MSIX-LocalDev.cer'
          [IO.File]::WriteAllBytes(
            $cerPath,
            $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )

          "CER_PATH=$cerPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore NuGet packages
        run: dotnet restore $env:PROJECT_PATH

      - name: Build MSIX bundle
        run: |
          dotnet build $env:PROJECT_PATH `
            --no-restore `
            -c Release `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms='x64|arm64' `
            -p:AppxPackageDir=$env:PACKAGE_DIR\ `
            -p:AppxPackageSigningEnabled=false `
            -p:SuppressSdkNoise=false

      - name: Find MSIX bundle
        id: bundle
        run: |
          $bundle = Get-ChildItem -Path $env:PACKAGE_DIR -Recurse -Filter *.msixbundle |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $bundle) {
            throw "No .msixbundle found under $env:PACKAGE_DIR"
          }

          "path=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($bundle.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Locate SignTool
        run: |
          $kitsRoot = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10 -ErrorAction Stop
          $sdkBinRoot = Join-Path $kitsRoot.KitsRoot10 'bin'
          $signtool = Get-ChildItem -Path $sdkBinRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found under $sdkBinRoot. Install the Windows SDK."
          }

          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign MSIX bundle
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign `
            /fd SHA256 `
            /f $env:PFX_PATH `
            /p $env:MSIX_PFX_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            ${{ steps.bundle.outputs.path }}

          if ($LASTEXITCODE -ne 0) {
            throw "SignTool signing failed with exit code $LASTEXITCODE"
          }

      - name: Verify MSIX bundle
        run: |
          & $env:SIGNTOOL verify /pa /v ${{ steps.bundle.outputs.path }}

          if ($LASTEXITCODE -ne 0) {
            throw "SignTool verification failed with exit code $LASTEXITCODE"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: signed-msix
          path: |
            ${{ steps.bundle.outputs.path }}
            ${{ env.CER_PATH }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $notes = if ($prev) {
            $log = git log "$prev..$tag" --oneline --no-decorate
            "Changes since ${prev}:`n$log"
          } else {
            "Automated MSIX release for $tag"
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes $notes
          }

          gh release upload $tag ${{ steps.bundle.outputs.path }} $env:CER_PATH --clobber
