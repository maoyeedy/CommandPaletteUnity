name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only supersede PR runs; pushes to master each keep their own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet tool run csharpier check .

      - name: Build (Release, x64)
        run: dotnet build UnityExtension/UnityExtension.csproj -c Release -p:Platform=x64 -p:SuppressSdkNoise=false

      # The unpackaged exe auto-initializes the Windows App SDK bootstrapper, which hangs the
      # test host on runners without the Windows App Runtime; tests only need ProjectParser.
      - name: Test
        timeout-minutes: 10
        run: dotnet test UnityExtension.Tests/UnityExtension.Tests.csproj -c Release -p:Platform=x64 -p:WindowsAppSdkBootstrapInitialize=false --blame-hang --blame-hang-timeout 2m

  # Packaging check: mirrors the build step of release-msix.yml (unsigned) so publish-profile or
  # runtime-pack problems surface on the PR instead of on the tag build.
  bundle-build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore UnityExtension/UnityExtension.csproj

      - name: Build MSIX bundle (unsigned)
        run: dotnet build UnityExtension/UnityExtension.csproj --no-restore -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Always -p:AppxBundlePlatforms="x64|arm64" -p:AppxPackageDir=${{ github.workspace }}\UnityExtension\BundleArtifacts\ -p:AppxPackageSigningEnabled=false -p:SuppressSdkNoise=false

      - name: Check bundle exists
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path UnityExtension\BundleArtifacts -Recurse -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw 'No .msixbundle produced under UnityExtension\BundleArtifacts' }
          Write-Host "Built $($bundle.Name) ($([math]::Round($bundle.Length / 1MB, 1)) MB)"

  validate-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check csproj and manifest versions agree
        run: |
          v=$(grep -oP '(?<=<Version>)[^<]+' UnityExtension/UnityExtension.csproj | head -1)
          a=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' UnityExtension/UnityExtension.csproj | head -1)
          f=$(grep -oP '(?<=<FileVersion>)[^<]+' UnityExtension/UnityExtension.csproj | head -1)
          m=$(grep -oP '<Identity[^>]*\sVersion="\K[^"]+' UnityExtension/Package.appxmanifest | head -1)
          echo "csproj=$v assembly=$a file=$f manifest=$m"
          test "$a" = "$v.0" && test "$f" = "$v.0" && test "$m" = "$v.0"
