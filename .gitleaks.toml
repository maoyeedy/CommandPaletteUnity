# gitleaks config for the hooks in .githooks/ (staged scan) and `just check` (working tree).
# Extends the default rule set; only the generated dev signing key is exempt.

[extend]
useDefault = true

[allowlist]
description = "MSIX dev-build temporary signing key (gitignored, regenerated by `just build`)"
paths = ['''^UnityExtension/UnityExtension_TemporaryKey\.pfx$''']
