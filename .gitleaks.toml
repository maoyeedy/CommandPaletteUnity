# gitleaks config for the hooks in .githooks/ (staged scan) and `just check` (working tree).
# Extends the default rule set; the dev signing key and vendored upstream source are exempt.

[extend]
useDefault = true

[allowlist]
description = "Generated dev signing key and gitignored upstream source (reference only, never shipped)"
paths = [
    '''^UnityExtension/UnityExtension_TemporaryKey\.pfx$''',
    '''^vendor/''',
]
